[package]
name = "vatermark"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "CPU image watermarking and experimental compression-tolerant VerusID authentication"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rustfft = "6.4"
reed-solomon = "0.2.1"
crc32fast = "1.4"
rand = "0.8.5"
rand_chacha = "0.3.1"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secp256k1 = { version = "0.31", features = ["recovery"] }
sha2 = "0.10"
ripemd = "0.1"
bs58 = { version = "0.5", features = ["check"] }
base64 = "0.22"
jpeg-encoder = "0.6"
sapling-crypto = { version = "=0.1.3", default-features = false }
jubjub = "0.10"
ff = "0.13"
group = "0.13"
blake2b_simd = "1"
chacha20poly1305 = "0.10"
bech32 = "0.9"
hex = "0.4"
zeroize = "1"

[profile.release]
lto = "thin"
